name: Tests

on:
  push:
  pull_request:

jobs:
  minimum-dependencies:
    name: Minimum dependencies (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints/minimum.txt -e ".[dev]"
      - name: Show resolved versions
        run: |
          python - <<'PY'
          import sys

          import joblib
          import numpy
          import sklearn

          print(f"Python {sys.version.split()[0]}")
          print(f"NumPy {numpy.__version__}")
          print(f"scikit-learn {sklearn.__version__}")
          print(f"joblib {joblib.__version__}")
          PY
      - run: make test

  examples:
    name: Complete examples (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: make examples

  quality:
    name: Lint and type check (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Show resolved versions
        run: |
          python - <<'PY'
          import sys

          import numpy

          print(f"Python {sys.version.split()[0]}")
          print(f"NumPy {numpy.__version__}")
          PY
          python -m mypy --version
          python -m ruff --version
      - name: Validate decision registry
        run: make decision-check
      - name: Run Ruff
        run: make lint
      - name: Run mypy
        run: make typecheck

  supported-python:
    name: Supported Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Show resolved versions
        run: |
          python - <<'PY'
          import sys

          import joblib
          import numpy
          import sklearn

          print(f"Python {sys.version.split()[0]}")
          print(f"NumPy {numpy.__version__}")
          print(f"scikit-learn {sklearn.__version__}")
          print(f"joblib {joblib.__version__}")
          PY
      - run: make test

  latest-dependencies:
    name: Latest dependencies (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install --upgrade -e ".[dev]"
          "numpy<3" "scikit-learn<2" "joblib<2"
      - name: Show resolved versions
        run: |
          python - <<'PY'
          import sys

          import joblib
          import numpy
          import sklearn

          print(f"Python {sys.version.split()[0]}")
          print(f"NumPy {numpy.__version__}")
          print(f"scikit-learn {sklearn.__version__}")
          print(f"joblib {joblib.__version__}")
          PY
      - run: make test
